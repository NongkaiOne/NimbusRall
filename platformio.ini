; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
data_dir = firmware_data

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    adafruit/Adafruit BME280 Library@2.3.0
    adafruit/Adafruit Unified Sensor@1.1.15
build_flags = -DCORE_DEBUG_LEVEL=1

[env:demo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DSMARTLINE_SENSOR_DEMO=1

; Standalone sensor test: no Wi-Fi, MQTT, filesystem or servo initialization.
[env:bme_test]
extends = env:esp32dev
build_src_filter = -<*> +<diagnostics/bme_test.cpp>
build_flags = ${env:esp32dev.build_flags} -DBME_STANDALONE_TEST=1

; BME + actual Wi-Fi connection using include/secrets.h; no servo or MQTT.
[env:bme_wifi_test]
extends = env:bme_test
build_flags = ${env:bme_test.build_flags} -DBME_WIFI_TEST=1

[env:sensors_offline_test]
extends = env:esp32dev
build_src_filter = -<*> +<diagnostics/sensors_offline_test.cpp>
build_flags = ${env:esp32dev.build_flags} -DSENSORS_OFFLINE_TEST=1

[env:prediction_offline_test]
extends = env:esp32dev
build_src_filter = -<*> +<diagnostics/prediction_offline_test.cpp> +<sensors.cpp> +<predictor.cpp>
build_flags = ${env:esp32dev.build_flags} -DPREDICTION_OFFLINE_TEST=1
extra_scripts = pre:scripts/embed_test_model.py

; ESP32 + Wi-Fi only; no sensors, filesystem, MQTT or servo initialization.
; Credentials: include/secrets.h. Reports the result of the 8.5 dBm TX setting.
[env:wifi_test]
extends = env:esp32dev
lib_deps =
build_src_filter = -<*> +<diagnostics/wifi_test.cpp>
build_flags = ${env:esp32dev.build_flags} -DWIFI_STANDALONE_TEST=1

; Full application with real sensors and servo output compiled out.
[env:system_no_servo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DSMARTLINE_NO_SERVO=1 -DSMARTLINE_WIFI_TX_POWER=WIFI_POWER_8_5dBm

; Firebase transport. Configure firebase_secrets.h before use.
[env:firebase_no_servo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DSMARTLINE_FIREBASE=1 -DSMARTLINE_NO_SERVO=1

[env:firebase_servo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DSMARTLINE_FIREBASE=1
